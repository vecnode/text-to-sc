[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supercollider-mcp-python"
version = "0.1.0"
description = "Python MCP server for SuperCollider"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.8.0",
  "psutil>=5.9.8",
]

[project.scripts]
supercollider-mcp-python = "mcp_py.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_py*"]
